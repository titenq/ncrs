name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: ncrs
            asset_name: ncrs-linux-amd64
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            artifact_name: ncrs.exe
            asset_name: ncrs-windows-amd64.exe
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            artifact_name: ncrs
            asset_name: ncrs-macos-amd64
            target: x86_64-apple-darwin
          - os: macos-latest
            artifact_name: ncrs
            asset_name: ncrs-macos-arm64
            target: aarch64-apple-darwin

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename Asset
        shell: bash
        run: mv target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ${{ matrix.asset_name }}

      - name: Strip binary (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: strip ${{ matrix.asset_name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
